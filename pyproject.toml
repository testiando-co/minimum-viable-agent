[project]
name = "minimum-viable-agent"
version = "0.1.0"
description = "Minimum Viable Agent (MVA) de QA con RAG local y contratos estrictos en Pydantic"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faiss-cpu>=1.16.0",
    "langchain>=1.5.2",
    "langchain-anthropic>=1.7.12",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.3",
    "pydantic>=2.14.4",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
